<!DOCTYPE html>
<html>
<head>
    <title>Set Username & Password</title>
</head>
<body>
    <h2>Create your username and password</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<p class="{{ category }}">{{ message }}</p>{% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" minlength="3" required>
        <input type="password" name="password" placeholder="Password (at least 8 characters)" minlength="8" required>
        <button type="submit">Complete Signup</button>
    </form>
</body>
</html>
